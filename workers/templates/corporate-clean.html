<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{businessName}} — {{headline}}</title>
<meta name="description" content="{{metaDescription}}"/>
<meta name="robots" content="noindex"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="{{businessName}} — {{headline}}"/>
<meta property="og:description" content="{{metaDescription}}"/>
<meta property="og:image" content="{{ogImage}}"/>
<meta property="og:url" content="{{pageUrl}}"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{businessName}} — {{headline}}"/>
<meta name="twitter:description" content="{{metaDescription}}"/>
<meta name="twitter:image" content="{{ogImage}}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#12233D;--accent:#1F8A70;--dim:#5C6B80;--line:#E5E9F0}
body{font-family:'Inter',system-ui,sans-serif;background:#FFFFFF;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
.hero{padding:80px 0 64px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero .k{color:var(--accent);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;line-height:1.12;margin-top:14px}
.hero p{margin-top:16px;color:var(--dim);font-size:1.06rem;max-width:48ch}
.cta{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:8px;font-size:.98rem}
.hero-visual{aspect-ratio:4/3;border-radius:12px;background:{{heroBackground}};background-size:cover;background-position:center;border:1px solid var(--line)}
section{padding:60px 0}
h2{font-size:1.45rem;font-weight:700}
.sub{color:var(--dim);margin-top:6px;font-size:.95rem}
.services{margin-top:28px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.svc{display:flex;gap:16px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--line)}
.svc:last-child{border-bottom:0}
.svc .chk{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#E9F5F1;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;margin-top:2px}
.svc h3{font-size:1.02rem;font-weight:600}
.svc p{color:var(--dim);font-size:.93rem;margin-top:2px}
.about{background:#F7F9FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:44px;margin-top:24px;align-items:start}
.about-grid>p{color:#33445C;font-size:1.02rem}
.rating{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.rating .stars{color:#E0A100;font-size:1.15rem;letter-spacing:2px}
.rating p{margin-top:6px;color:var(--dim);font-size:.9rem}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:28px}
.contact-grid a{color:var(--accent);font-weight:600;font-size:1.2rem;text-decoration:none}
.contact-grid .lbl{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;display:block;margin-bottom:6px}
footer{padding:36px 0 100px;border-top:1px solid var(--line);color:var(--dim);font-size:.85rem}
.brandbar{position:fixed;left:0;right:0;bottom:0;background:#12233D;color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 44px 10px 16px;font-size:.85rem;z-index:50}
.brandbar a{background:#C1FE00;color:#12233D;text-decoration:none;font-weight:600;padding:6px 14px;border-radius:6px;font-size:.8rem}
.brandbar button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8FA0B8;font-size:1rem;cursor:pointer;padding:6px}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.about-grid,.contact-grid{grid-template-columns:1fr}.hero{padding:56px 0 44px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap hero-grid">
<div>
<span class="k">{{businessName}}</span>
<h1>{{headline}}</h1>
<p>{{subheadline}}</p>
<a class="cta" href="{{phoneHref}}">{{ctaLabel}}</a>
</div>
<div class="hero-visual" role="img" aria-label="{{businessName}}"></div>
</div></header>

<section><div class="wrap">
<h2>{{servicesLabel}}</h2>
<div class="services">{{servicesHtml}}</div>
</div></section>

<section class="about"><div class="wrap">
<h2>{{aboutLabel}}</h2>
<div class="about-grid">
<p>{{about}}</p>
{{ratingBlock}}
</div>
</div></section>

<section><div class="wrap">
<h2>{{contactLabel}}</h2>
<div class="contact-grid">
<div><span class="lbl">{{phoneLabel}}</span><a href="{{phoneHref}}">{{phone}}</a></div>
<div><span class="lbl">{{addressLabel}}</span><p>{{address}}</p></div>
</div>
</div></section>

<footer><div class="wrap"><p>© {{year}} {{businessName}}</p><p style="margin-top:6px">{{disclaimer}}</p></div></footer>

<div class="brandbar" id="bb"><span>Concept by FlowDev</span><a href="{{calLink}}">Book a call</a><button aria-label="Close" onclick="sessionStorage.setItem('bb','1');document.getElementById('bb').style.display='none'">✕</button></div>
<script>if(sessionStorage.getItem('bb')){document.getElementById('bb').style.display='none'}</script>
</body>
</html>
