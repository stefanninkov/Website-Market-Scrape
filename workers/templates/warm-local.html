<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{businessName}} — {{headline}}</title>
<meta name="description" content="{{metaDescription}}"/>
<meta name="robots" content="noindex"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="{{businessName}} — {{headline}}"/>
<meta property="og:description" content="{{metaDescription}}"/>
<meta property="og:image" content="{{ogImage}}"/>
<meta property="og:url" content="{{pageUrl}}"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{businessName}} — {{headline}}"/>
<meta name="twitter:description" content="{{metaDescription}}"/>
<meta name="twitter:image" content="{{ogImage}}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#FAF6EF;--ink:#2B2118;--accent:#C4572E;--dim:#7A6E60}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces',Georgia,serif}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}
.hero{padding:72px 0 56px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.hero .k{color:var(--accent);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
.hero h1{font-size:clamp(2.3rem,5.5vw,3.8rem);font-weight:700;line-height:1.08;margin-top:12px}
.hero p{margin-top:16px;color:var(--dim);font-size:1.08rem;max-width:46ch}
.cta{display:inline-block;margin-top:28px;background:var(--accent);color:#FFF7EE;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:999px;font-size:1rem}
.hero-visual{aspect-ratio:4/3;border-radius:24px;background:{{heroBackground}};background-size:cover;background-position:center;box-shadow:0 18px 44px rgba(43,33,24,.14)}
section{padding:56px 0}
h2{font-size:1.7rem;font-weight:700}
.services{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;margin-top:28px}
.svc{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed #E3D9C9}
.svc .ico{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:#F1E7D8;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.svc h3{font-size:1.06rem;font-weight:700}
.svc p{color:var(--dim);font-size:.92rem}
.rating{margin-top:32px;background:#FFFDF8;border:1px solid #EDE3D2;border-radius:18px;padding:24px 28px;display:inline-block}
.rating .stars{color:#E0A100;font-size:1.35rem;letter-spacing:3px}
.rating p{margin-top:6px;color:var(--dim);font-size:.95rem}
.about p{margin-top:20px;color:#4A4036;font-size:1.05rem;max-width:62ch}
.contact{background:#F3ECDF;border-radius:24px;padding:44px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
.contact-grid a{color:var(--accent);font-weight:600;font-size:1.25rem;text-decoration:none}
.contact-grid .lbl{color:var(--dim);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;display:block;margin-bottom:6px}
footer{padding:40px 0 100px;color:var(--dim);font-size:.85rem;text-align:center}
.brandbar{position:fixed;left:0;right:0;bottom:0;background:#2B2118;color:#FAF6EF;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 44px 10px 16px;font-size:.85rem;z-index:50}
.brandbar a{background:#C1FE00;color:#2B2118;text-decoration:none;font-weight:600;padding:6px 14px;border-radius:6px;font-size:.8rem}
.brandbar button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#B4A897;font-size:1rem;cursor:pointer;padding:6px}
@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.services{grid-template-columns:1fr}.contact-grid{grid-template-columns:1fr}.contact{padding:28px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap hero-grid">
<div>
<span class="k">{{businessName}}</span>
<h1>{{headline}}</h1>
<p>{{subheadline}}</p>
<a class="cta" href="{{phoneHref}}">{{ctaLabel}}</a>
</div>
<div class="hero-visual" role="img" aria-label="{{businessName}}"></div>
</div></header>

<section><div class="wrap">
<h2>{{servicesLabel}}</h2>
<div class="services">{{servicesHtml}}</div>
</div></section>

<section class="about"><div class="wrap">
<h2>{{aboutLabel}}</h2>
<p>{{about}}</p>
{{ratingBlock}}
</div></section>

<section><div class="wrap"><div class="contact">
<h2>{{contactLabel}}</h2>
<div class="contact-grid">
<div><span class="lbl">{{phoneLabel}}</span><a href="{{phoneHref}}">{{phone}}</a></div>
<div><span class="lbl">{{addressLabel}}</span><p>{{address}}</p></div>
</div>
</div></div></section>

<footer><div class="wrap"><p>© {{year}} {{businessName}}</p><p style="margin-top:6px">{{disclaimer}}</p></div></footer>

<div class="brandbar" id="bb"><span>Concept by FlowDev</span><a href="{{calLink}}">Book a call</a><button aria-label="Close" onclick="sessionStorage.setItem('bb','1');document.getElementById('bb').style.display='none'">✕</button></div>
<script>if(sessionStorage.getItem('bb')){document.getElementById('bb').style.display='none'}</script>
</body>
</html>
